<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#fffcf5">
    <title>Email verified · QuestLife</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">✓</div>
      <p class="eyebrow">QuestLife account</p>
      <h1>Your email is verified.</h1>
      <p>Return to QuestLife to finish signing in and start your first adventure.</p>
      <a id="open-app" class="open-app" href="questlife://auth/callback" aria-disabled="true">Open QuestLife</a>
      <p id="help" class="help">Preparing your secure sign-in…</p>
      <footer>QuestLife</footer>
    </main>
    <script>
      (() => {
        const code = new URLSearchParams(window.location.search).get("code");
        const button = document.getElementById("open-app");
        const help = document.getElementById("help");

        if (!code) {
          help.textContent = "This verification link is incomplete or has already been used. Return to QuestLife and request a new email.";
          help.classList.add("error");
          return;
        }

        button.href = `questlife://auth/callback?code=${encodeURIComponent(code)}`;
        button.setAttribute("aria-disabled", "false");
        help.textContent = "If the app does not open, launch QuestLife on your phone and sign in with your verified email.";
        window.history.replaceState({}, document.title, window.location.pathname);
      })();
    </script>
  </body>
</html>
